{# `record_url` differs by caller: a live drill posts against its token, a
   skipped one picked up later posts against its attempt id. Same protocol. #}
<form hx-post="{{ record_url }}" hx-target="#exchange-result" class="stack wide">
  <label class="block">
    <textarea name="pasted" rows="6" required
      placeholder="Paste the whole fenced JSON block.">{{ pasted or "" }}</textarea>
  </label>
  <button type="submit">Record diagnosis</button>
</form>
