[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studykernel"
version = "0.1.0.dev0"
description = "A learning kernel: model the learner, define the goal, allocate effort by gradient."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# The kernel itself is deliberately dependency-light: stdlib plus a YAML
# parser for pack loading. Anything heavier belongs to ingest.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Importers only. The study loop never needs these.
ingest = ["pyarrow>=14.0", "pandas>=2.0"]
# httpx backs fastapi's TestClient, which is how the web invariants in
# tests/test_web.py are checked over real HTTP rather than by calling handlers.
dev = ["pytest>=7.4", "httpx>=0.27"]
# The local web front end. Separate so the study loop keeps working with no
# web install at all -- `study drill` must never depend on this resolving.
web = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.scripts]
study = "kernel.cli:main"
# Deliberately a function, not `uvicorn web.app:app`. See web/app.py: passing
# the app object makes multi-worker operation structurally unavailable, and
# drill state is an in-process dict that multiple workers would silently break.
study-web = "web.app:run"

[tool.setuptools]
packages = [
    "kernel",
    "kernel.state",
    "kernel.objectives",
    "kernel.pedagogy",
    "kernel.exchange",
    "kernel.storage",
    "kernel.analytics",
    "web",
]

[tool.setuptools.package-data]
"kernel.storage" = ["*.sql"]
"kernel.exchange" = ["prompts/*.md"]
# Templates and static assets ship with the package, so `study-web` works from
# any directory the way `study` does. KaTeX will live under static/ and is
# bundled rather than fetched -- WEB_UI.md §3 requires it work offline.
"web" = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
