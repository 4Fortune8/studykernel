# TSIA2 mathematics taxonomy: four domains x diagnostic levels 1-6.
#
# This is why TSIA2 was chosen as Product 1 (DESIGN.md §11): the published
# taxonomy means the prerequisite DAG arrives pre-seeded at confidence 1.0,
# removing the cold-start problem the GRE product structurally has.
#
# Coverage weights are flat across the four domains. With ~5 math items per
# domain, no narrow topic repays deep specialization -- breadth dominates
# depth, the opposite of GRE quant tuning. DESIGN.md §13.3.

