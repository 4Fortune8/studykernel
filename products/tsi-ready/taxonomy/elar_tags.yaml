# TSIA2 ELAR taxonomy. DATA_SOURCING_ELAR.md §1.
#
# Note the shape difference from math: no diagnostic levels, because ELAR has
# no published level structure to seed from. Reliability carries the whole
# weight of the mastery judgment here.
#
# The `sentence-revision` children are exactly the transformation library of
# the injection generator (DATA_SOURCING_ELAR.md §3) -- **the tag is the
# transformation**, which is what makes generated items arrive labeled for
# free, and what makes this the one tag family whose supply can never starve.
#
# Roughly half the 30-item ELAR CRC is writing/revision. The universal failure
# pattern is over-preparing reading (practice is abundant) and under-preparing
# revision (it isn't), so the weights below deliberately do not follow how
# easy the items are to source.

tags:
  - slug: literary-analysis
    display_name: "Literary text analysis: theme, tone, characterization, figurative language"
    section: elar
    coverage_weight: 1.0

  - slug: informational-analysis
    display_name: "Informational text: main idea, inference, author's purpose, evidence"
    section: elar
    coverage_weight: 1.0

  - slug: synthesis-two-sources
    display_name: "Cross-passage synthesis"
    section: elar
    # Supplied by official samples only; will read as supply-constrained in
    # the availability report. That is correct behavior, not a bug to paper
    # over. DATA_SOURCING_ELAR.md §2.1.
    coverage_weight: 0.6

